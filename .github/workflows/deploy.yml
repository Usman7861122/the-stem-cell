name: Deploy to S3

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-s3
  cancel-in-progress: true

permissions:
  id-token: write   # needed for OIDC login to AWS
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Files that never change name: cache for a long time
      - name: Upload assets (long cache)
        run: |
          aws s3 sync dist/ s3://the-stem-cell-website \
            --delete \
            --exclude "*.html" \
            --cache-control "public,max-age=31536000,immutable"

      # HTML files: always check for a fresh copy
      - name: Upload HTML (short cache)
        run: |
          aws s3 sync dist/ s3://the-stem-cell-website \
            --exclude "*" --include "*.html" \
            --cache-control "public,max-age=0,must-revalidate"
