name: Deploy to S3

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-s3
  cancel-in-progress: true

permissions:
  id-token: write   # needed for OIDC login to AWS
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://www.thestemcellinstitute.com
          PUBLIC_FORM_ENDPOINT: https://z6kh4dxswgkcysul34yhllj3he0phvnt.lambda-url.us-east-1.on.aws/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 1) Hashed build files (/_astro): the name changes when the file changes, so cache for 1 year
      - name: Upload hashed files (1 year cache)
        run: |
          aws s3 sync dist/_astro s3://the-stem-cell-website/_astro \
            --cache-control "public,max-age=31536000,immutable"

      # 2) Other files (images, fonts, sitemap, robots, llms.txt): same name, so cache for 1 day
      - name: Upload other files (1 day cache)
        run: |
          aws s3 sync dist/ s3://the-stem-cell-website \
            --delete \
            --exclude "*.html" \
            --exclude "_astro/*" \
            --cache-control "public,max-age=86400"

      # 3) HTML last, so new pages never point to files that are not uploaded yet
      - name: Upload HTML (always check for a fresh copy)
        run: |
          aws s3 sync dist/ s3://the-stem-cell-website \
            --delete \
            --exclude "*" --include "*.html" \
            --cache-control "public,max-age=0,must-revalidate"
